name: 'App CD'

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      WIF_PROVIDER:
        required: true
      CICD_SA:
        required: true
      PROJECT_ID:
        required: true

jobs:

  seed_database:
    name: 'Seed BigQuery /w Mock Data (${{ inputs.environment }})'
    if: inputs.environment == 'dev'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

#      Action won't work as expected on self hosted runners
#      - name: Set up Python
#        uses: actions/setup-python@v5
#        with:
#          python-version: '3.14'

      - name: Verify Py version
        run: python --version

#      - name: Install Python Dependencies
#        run: pip install pandas faker

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CICD_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Generate Mock Data (venv)
        run: |
          echo "Setting up Virtual Environment..."
          python -m venv .venv
          source .venv/bin/activate
          
          echo "Installing dependencies..."
          pip install pandas faker
          
          echo "Executing mock data script..."
          python src/externalScripts/mock-data.py

      - name: Load Data to BigQuery
        run: |
          bq load \
            --source_format=CSV \
            --replace \
            --skip_leading_rows=1 \
            --autodetect \
            ${{ secrets.PROJECT_ID }}:financial_${{ inputs.environment }}.invoices \
            mock_invoices.csv 

  build_and_deploy_nlp:
    name: 'Deploy NLP App (${{ inputs.environment }})'
    needs: seed_database
    if: always() && (needs.seed_database.result == 'success' || needs.seed_database.result == 'skipped')
    runs-on: self-hosted
    env:
      REGION: europe-west3
      REPO_NAME: behavio-repo-${{ inputs.environment }}
      APP_NAME: behavio-bot-${{ inputs.environment }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CICD_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

#      - name: Set up Python for metadata gen
#        uses: actions/setup-python@v5
#        with:
#          python-version: '3.14'

      - name: Verify Py version
        run: python --version

#      - name: Install Schema Generator Dependencies
#        run: pip install google-cloud-bigquery pyyaml

      - name: Generate tables.yaml
        env:
          GCP_PROJECT_ID: ${{ secrets.PROJECT_ID }}
          BQ_DATASET_ID: financial_${{ inputs.environment }}
        run: |
          echo "Setting up venv..."
          python -m venv .venv
          source .venv/bin/activate
          
          echo "Installing dependencies..."
          pip install google-cloud-bigquery pyyaml
          
          echo "Executing schema generator..."
          python src/externalScripts/build-metadata.py

      - name: Schema readback
        run: cat tables.yaml

      - name: Configure docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push to GCP docker registry
        run: |
          IMAGE_URL=${{ env.REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          
          echo "Moving tables.yaml into the Docker build context..."
          mv tables.yaml src/BehavioBOT/tables.yaml
          
          echo "Building image: $IMAGE_URL"
          docker build -t $IMAGE_URL ./src/BehavioBOT
          
          echo "Pushing image to Artifact Registry..."
          docker push $IMAGE_URL

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URL=${{ env.REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          
          gcloud run deploy ${{ env.APP_NAME }} \
            --image $IMAGE_URL \
            --region ${{ env.REGION }} \
            --project ${{ secrets.PROJECT_ID }} \
            --quiet

  deploy_alerting_config:
      name: 'Deploy alerting config (${{ inputs.environment }})'
      runs-on: self-hosted
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Authenticate to GCP
          uses: google-github-actions/auth@v2
          with:
            workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
            service_account: ${{ secrets.CICD_SA }}

        - name: Set up Cloud SDK
          uses: google-github-actions/setup-gcloud@v2

        - name: Upload Alert Definitions to GCS
          run: |
            # Calculate the exact bucket name based on your Terraform configuration
            BUCKET_NAME="${{ secrets.PROJECT_ID }}-alerting-config-${{ inputs.environment }}"
            
            echo "Syncing alert_definitions.yaml to gs://$BUCKET_NAME/..."
            
            # We use gcloud storage cp to push the file to the bucket
            gcloud storage cp src/automatedAlerting/alert_definitions.yaml gs://$BUCKET_NAME/alert_definitions.yaml
            
            echo "Alert definitions updated successfully!"

        - name: Deploy Alerting Cloud Function
          run: |
            echo "Deploying Python code to Cloud Functions Gen 2..."
            
            # We use gcloud to push the source directory directly to the function shell
            # that Terraform bootstrapped.
            gcloud functions deploy behavio-alerting-${{ inputs.environment }} \
              --gen2 \
              --region=europe-west3 \
              --project=${{ secrets.PROJECT_ID }} \
              --source=src/automatedAlerting \
              --entry-point=read_and_alert \
              --runtime=python312 \
              --service-account=sa-alerting-${{ inputs.environment }}@${{ secrets.PROJECT_ID }}.iam.gserviceaccount.com \
              --set-env-vars=PROJECT_ID=${{ secrets.PROJECT_ID }},GCS_BUCKET_NAME=${{ secrets.PROJECT_ID }}-alerting-config-${{ inputs.environment }},GCS_BLOB_NAME=alert_definitions.yaml \
              --quiet